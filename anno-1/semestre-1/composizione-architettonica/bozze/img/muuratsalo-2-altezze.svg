<text x="457.0" y="558.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f5fae">+3,00</text>
<text x="684.0" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Recinto sud (dalla foto del patio):</text>
<text x="684.0" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">pezzo ovest da 6,60 nell'angolo</text>
<text x="684.0" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">a 5,30 verso l'apertura;</text>
<text x="684.0" y="477" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">pezzo est da 4,25 verso</text>
<text x="684.0" y="494" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">l'apertura a 3,50 verso le camere.</text>
<text x="684.0" y="511" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Le camere hanno il tetto che</text>
<text x="684.0" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">scende verso est.</text>
