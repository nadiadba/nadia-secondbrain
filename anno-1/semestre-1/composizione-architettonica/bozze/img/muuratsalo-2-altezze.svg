<text x="83.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">±0,00 pavimento</text>
<text x="684.0" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Il tetto è a «farfalla»:</text>
<text x="684.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">scende da ovest a est fino</text>
<text x="684.0" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">a 12,25 m e poi risale.</text>
<text x="684.0" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Lo spessore del tetto è 0,50</text>
<text x="684.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">(il Poliplat).</text>
<text x="14" y="394" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">2. Patio e ala delle camere (sezione sul patio della scheda)</text>
