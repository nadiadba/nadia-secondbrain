<text x="16" y="775.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Lo schema è in scala; le misure esatte sono nella tabella.</text>
<text x="16" y="793.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Tra i pezzi non c'è spazio: due pezzi vicini hanno la linea di taglio in comune, e un taglio solo li separa.</text>
