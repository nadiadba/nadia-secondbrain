<text x="750.0" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Qui il tetto è orizzontale:</text>
<text x="750.0" y="469" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">la falda scende solo</text>
<text x="750.0" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">da nord verso sud.</text>
<text x="750.0" y="503" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">L'ingresso in legno è basso,</text>
<text x="750.0" y="520" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">come quello di Aalto.</text>
<text x="28.0" y="726.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">ovest (patio)</text>
<text x="636.0" y="726.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">est</text>
