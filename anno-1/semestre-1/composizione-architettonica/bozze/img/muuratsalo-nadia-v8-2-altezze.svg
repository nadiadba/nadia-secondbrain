<line x1="363.6" y1="354.0" x2="363.6" y2="266.0" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="357.6" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="end">2,20 sotto</text>
<text x="750.0" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Il tetto è alto 6,30 sopra le camere</text>
<text x="750.0" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">e scende fino a 4,50 sul muro</text>
<text x="750.0" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">sud del soggiorno. Spessore 0,30.</text>
<text x="750.0" y="149" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Il profilo (tratteggio) continua sui</text>
<text x="750.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">muri del recinto: scende fino a 4,21</text>
<text x="750.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">a 2,15 m dal perimetro, come Aalto,</text>
<text x="750.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">e risale a 4,86 sul recinto sud.</text>
<text x="750.0" y="217" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Nel punto più basso del soppalco</text>
<text x="750.0" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">restano 2,26 m sopra la testa.</text>
<text x="28.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">nord (camera)</text>
<text x="636.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">sud (lago)</text>
<text x="14" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">2. Sezione ovest-est (a 6,30 m dal filo nord): patio, soggiorno, cucina, ingresso</text>
