<text x="286.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#666666">(−1)<tspan font-size="75%" dy="-6">3</tspan><tspan dy="6">​</tspan> = −1</text>
<text x="280.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666666">si parte con + in alto a sinistra e si alterna, come una scacchiera</text>
