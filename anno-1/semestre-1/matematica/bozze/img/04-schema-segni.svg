<text x="286.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" fill="#222">segno = (−1)<tspan font-size="75%" dy="-6">i+j</tspan><tspan dy="6">​</tspan></text>
