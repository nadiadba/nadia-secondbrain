<text x="148.4" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">C₁</text>
<text x="168.4" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-style="italic">≡ T<tspan dy="4" font-size="70%">1r</tspan><tspan dy="-4"></tspan></text>
<text x="276.4" y="137.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a">r₂ ≡ B₂C₂</text>
<text x="20" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">C sta su π₁: C₂ è sulla LT e C₁ è già la prima traccia della retta r = BC.</text>
<text x="20" y="477" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Con la prima traccia di un'altra retta (s = AB) si hanno i due punti che bastano per t₁α.</text>
<text x="20" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La seconda traccia del piano non serve.</text>
