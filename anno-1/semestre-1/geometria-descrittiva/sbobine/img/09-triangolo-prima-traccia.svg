<text x="297.8" y="342.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">A₁</text>
<circle cx="406.0" cy="114.2" r="2.8" fill="#2563a8"/>
<text x="414.0" y="108.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">B₂</text>
<circle cx="406.0" cy="288.9" r="2.8" fill="#2563a8"/>
<text x="414.0" y="294.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">B₁</text>
<circle cx="166.4" cy="215.0" r="2.8" fill="#2563a8"/>
<text x="160.4" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">C₂</text>
