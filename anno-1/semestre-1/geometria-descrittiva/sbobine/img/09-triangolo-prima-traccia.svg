<circle cx="281.1" cy="215.0" r="2.8" fill="#d97706"/>
<text x="219.1" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">(T<tspan dy="4" font-size="70%">1s</tspan><tspan dy="-4"></tspan>)₂</text>
<circle cx="281.1" cy="331.1" r="2.8" fill="#d97706"/>
<text x="247.1" y="345.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">T<tspan dy="4" font-size="70%">1s</tspan><tspan dy="-4"></tspan></text>
<text x="350.5" y="145.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">s₂</text>
<text x="364.7" y="318.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">s₁</text>
<line x1="70.0" y1="215.0" x2="446.8" y2="422.2" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
<text x="452.8" y="432.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan>α</text>
<circle cx="307.8" cy="193.4" r="2.8" fill="#2563a8"/>
<text x="297.8" y="183.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">A₂</text>
