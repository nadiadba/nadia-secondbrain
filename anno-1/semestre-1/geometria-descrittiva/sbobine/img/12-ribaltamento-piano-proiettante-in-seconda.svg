<text x="20" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il piano è perpendicolare a π₂: in seconda proiezione la figura cade su t₂α.</text>
<text x="20" y="477" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Si ruota intorno a t₂α («il famoso angolo di 90 gradi»): da ogni punto, perpendicolare a t₂α,</text>
<text x="20" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">si riporta l'aggetto. Il lato AB è proiettante in seconda: in pianta A₁B₁ è già in vera lunghezza</text>
<text x="20" y="511" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">e nel ribaltamento resta uguale (tre lineette). La figura non si restringe mentre ruota.</text>
