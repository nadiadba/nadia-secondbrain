<text x="20" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il piano è verticale: tutta la figura, in prima proiezione, cade sulla traccia t₁α (A₁, B₁, C₁).</text>
<text x="20" y="427" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Da ogni punto si manda la perpendicolare a t₁α («a 90 gradi») e si riporta la quota del punto</text>
<text x="20" y="444" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">(per B: le due lineette). Ruotando intorno a t₁α la quota non cambia: A*B*C* è la vera forma.</text>
