<text x="245.4" y="322.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">A*</text>
<circle cx="281.7" cy="446.7" r="2.8" fill="#c0392b"/>
<text x="289.7" y="456.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">B*</text>
<text x="116.4" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-style="italic">≡ C*</text>
<text x="20" y="520" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. t₁γ ⊥ t₁α per B₁ (γ è proiettante in prima e perpendicolare ad α); H = t₁γ ∩ t₁α.</text>
<text x="20" y="537" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. Ribaltamento laterale di γ: da B₁, perpendicolare a t₁γ, la quota di B (due lineette): B̄.</text>
<text x="20" y="554" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. HB̄ è il raggio di rotazione: centro in H, lo si riporta su t₁γ e si trova B*.</text>
<text x="20" y="571" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">4. Affinità di asse t₁α: la retta A₁B₁ incontra l'asse in U; U-B* incontra in A* la</text>
<text x="20" y="588" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    perpendicolare all'asse condotta da A₁. C sta sull'asse e non si muove: C* ≡ C₁.</text>
