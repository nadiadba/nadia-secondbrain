<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 286" width="600" height="286">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Scrivere tra due linee parallele: le lettere vengono tutte uguali</text>
<g transform="translate(0,36)">
<line x1="40.0" y1="48.0" x2="360.0" y2="48.0" stroke="#8a8a8a" stroke-width="0.9" stroke-linecap="round"/>
<line x1="40.0" y1="70.0" x2="360.0" y2="70.0" stroke="#8a8a8a" stroke-width="0.9" stroke-linecap="round"/>
<text x="46.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#333" text-anchor="start">NOME E COGNOME</text>
<line x1="40.0" y1="103.0" x2="360.0" y2="103.0" stroke="#8a8a8a" stroke-width="0.9" stroke-linecap="round"/>
<line x1="40.0" y1="125.0" x2="360.0" y2="125.0" stroke="#8a8a8a" stroke-width="0.9" stroke-linecap="round"/>
<text x="46.0" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#333" text-anchor="start">DATA</text>
<line x1="400.0" y1="45.0" x2="575.0" y2="45.0" stroke="#8a8a8a" stroke-width="0.9" stroke-linecap="round"/>
<line x1="400.0" y1="117.0" x2="575.0" y2="117.0" stroke="#8a8a8a" stroke-width="0.9" stroke-linecap="round"/>
<text x="410.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="100" fill="#999" text-anchor="start">MS</text>
<text x="485.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">linee lontane:</text>
<text x="485.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">più difficile</text>
<line x1="380.0" y1="52.0" x2="380.0" y2="72.0" stroke="#2563a8" stroke-width="1" stroke-linecap="round"/>
<polygon points="380.0,72.0 375.9,63.0 384.1,63.0" fill="#2563a8" fill-opacity="1" stroke="none" stroke-linejoin="round"/>
<line x1="380.0" y1="64.0" x2="380.0" y2="44.0" stroke="#2563a8" stroke-width="1" stroke-linecap="round"/>
<polygon points="380.0,44.0 384.1,53.0 375.9,53.0" fill="#2563a8" fill-opacity="1" stroke="none" stroke-linejoin="round"/>
<text x="376.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2563a8" text-anchor="end">linee vicine</text>
<text x="16" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Le due linee si tracciano a mano, leggere; le lettere toccano sia la linea sotto sia quella sopra.</text>
<text x="16" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Così si scrivono nome, cognome e data sul foglio (come nell'intestazione della scheda).</text>
</g>
</svg>
