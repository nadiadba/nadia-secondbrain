<text x="20" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. AD è un'orizzontale (A₂D₂ parallela alla LT), AB è una frontale (A₁B₁ parallela alla LT).</text>
<text x="20" y="435" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. t₁α passa per la prima traccia della frontale T₁f ed è parallela a o₁ (non a un lato qualunque).</text>
<text x="20" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. t₂α passa per la seconda traccia dell'orizzontale T₂o ed è parallela a f₂. Le tracce si</text>
<text x="20" y="469" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    incontrano sulla LT.</text>
<text x="20" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">4. Retta p perpendicolare al piano (qui per C): p₁ perpendicolare a t₁α e a tutte le orizzontali,</text>
<text x="20" y="503" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    p₂ perpendicolare a t₂α e a tutte le frontali. Vanno fatte tutte e due le proiezioni.</text>
