<text x="14" y="566" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">In seconda: VB è una retta di profilo, il richiamo non basta; 2-3 è un'orizzontale, quindi 3₂ sta alla quota di 2₂.</text>
