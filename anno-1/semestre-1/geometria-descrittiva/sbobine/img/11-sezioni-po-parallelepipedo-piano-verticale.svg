<text x="24.0" y="443.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a">π<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan></text>
<text x="18" y="461" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">β (faccia anteriore) e γ (faccia posteriore) sono proiettanti in prima, come il piano secante α.</text>
<text x="18" y="483" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r = α ∩ β è verticale: r₁ ≡ T₁r, r₂ ⊥ LT (T₂r all'infinito); taglia gli spigoli orizzontali in 1 e 2.</text>
<text x="18" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lo stesso con γ: m₁ ≡ T₁m, m₂ ⊥ LT, punti 3 e 4.</text>
<text x="18" y="527" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">In pianta la sezione è il segmento r₁m₁ su t₁α, rinforzato; qui si tiene la parte destra del solido.</text>
