<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Sezione di un parallelepipedo con un piano verticale</text>
<g transform="translate(0,36)">
<line x1="20.0" y1="205.0" x2="510.0" y2="205.0" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
