<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Esercizio: pianta 4 × 2 cm, altezza 5 cm</text>
<g transform="translate(0,36)">
<text x="18" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La pianta resta in vera forma (lati 4 e 2 cm) e fa da base al solido.</text>
<text x="18" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Le altezze si prendono su z* (5 cm) e si riducono su z′ con la parallela a s*.</text>
<text x="18" y="516" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Prospetti assonometrici: la pianta si proietta su x′ e su y′ e si alza fino a h′.</text>
