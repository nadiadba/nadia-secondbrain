<text x="20" y="487" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">y* è y ribaltato sul quadro, a 90 gradi da y′. s* (in azzurro) unisce u su y* con u′y su y′.</text>
<text x="20" y="504" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Ogni profondità vera h presa su y* si porta su y′ con la parallela a s*: si ottiene h′.</text>
