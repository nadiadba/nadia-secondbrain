<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" width="640" height="596">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Omologia speciale con l'asse all'infinito: trovare s′ dato s</text>
<g transform="translate(0,36)">
<line x1="360.0" y1="200.0" x2="600.0" y2="120.0" stroke="#2563a8" stroke-width="1.6" stroke-linecap="round"/>
