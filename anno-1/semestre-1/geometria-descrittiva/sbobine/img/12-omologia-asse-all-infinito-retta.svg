<text x="506.5" y="220.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">A′</text>
<circle cx="190.0" cy="246.7" r="2.8" fill="#2563a8"/>
<text x="168.0" y="240.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-style="italic">M</text>
<circle cx="113.0" cy="316.4" r="2.8" fill="#c0392b"/>
<text x="85.0" y="310.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">M′</text>
<text x="560.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-style="italic">u all'infinito</text>
<text x="20" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. A su r e A′ su r′, allineati con il centro U. Su s si prende un punto qualunque M.</text>
<text x="20" y="503" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. La retta AM; la corrispondente passa per A′ ed è parallela ad AM (l'asse è all'infinito).</text>
<text x="20" y="520" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. M′ sta sul raggio UM. s′ passa per M′ ed è parallela a s.</text>
