<text x="24.0" y="22.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a">π<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan></text>
<text x="24.0" y="463.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a">π<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan></text>
<text x="18" y="481" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">In terza proiezione α si vede di taglio (t₃α): r₃ = t₃α ∩ t₃δ, m₃ = t₃α ∩ t₃γ.</text>
<text x="18" y="503" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r ed m sono parallele alla LT: r₁ ≡ t₁δ e m₁ ≡ t₁γ; r₂ e m₂ tagliano gli spigoli in 1, 2 e 3, 4.</text>
<text x="18" y="525" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La sezione 1-2-3-4 si ripassa e si campisce; la parte del solido sopra il piano si elimina (grigio).</text>
