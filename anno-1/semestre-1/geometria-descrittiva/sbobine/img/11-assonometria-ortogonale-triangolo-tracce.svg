<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Assonometria ortogonale: il triangolo delle tracce</text>
<g transform="translate(0,36)">
<text x="18" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il quadro taglia gli assi x, y, z in X, Y, Z: il triangolo XYZ è il triangolo delle tracce.</text>
<text x="18" y="468" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La proiezione ortogonale dell'origine, O′, cade nell'ortocentro (dove si incontrano le altezze).</text>
<text x="18" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Triangolo equilatero: isometria; isoscele: dimetria; scaleno (come qui): trimetria.</text>
