<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 596" width="620" height="596">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Nello spazio: il quadro è verticale (contiene x e z)</text>
<g transform="translate(0,36)">
<polygon points="142.6,440.6 466.9,362.9 466.9,58.5 142.6,136.2" fill="#9aa5b1" fill-opacity="0.12" stroke="#9aa5b1" stroke-width="1.8"/>
<text x="152.6" y="158.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a8a8a" font-style="italic">quadro</text>
<line x1="290.0" y1="270.0" x2="447.3" y2="232.3" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="290.0" y1="270.0" x2="290.0" y2="117.8" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="290.0" y1="270.0" x2="413.9" y2="330.5" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<text x="427.3" y="222.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">x ≡ x′</text>
<text x="296.0" y="117.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">z ≡ z′</text>
<text x="419.9" y="340.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">y</text>
<line x1="290.0" y1="270.0" x2="204.4" y2="388.7" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<text x="184.4" y="398.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">y′</text>
<polygon points="290.0,270.0 365.7,307.0 236.5,344.2" fill="#2e8b57" fill-opacity="0.12" stroke="#2e8b57" stroke-width="1.8"/>
<line x1="365.7" y1="307.0" x2="236.5" y2="344.2" stroke="#2e8b57" stroke-width="2" stroke-linecap="round"/>
<circle cx="290.0" cy="270.0" r="2.8" fill="#1f1f1f"/>
<text x="226.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">O ≡ O′</text>
<circle cx="398.1" cy="244.1" r="2.8" fill="#1f1f1f"/>
<text x="394.1" y="234.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">u</text>
<circle cx="290.0" cy="146.0" r="2.8" fill="#1f1f1f"/>
<text x="298.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">u</text>
<circle cx="365.7" cy="307.0" r="2.8" fill="#1f1f1f"/>
<text x="365.7" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">U<tspan dy="4" font-size="70%">y</tspan><tspan dy="-4"></tspan></text>
<line x1="299.7" y1="267.7" x2="308.7" y2="272.1" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="308.7" y1="272.1" x2="299.0" y2="274.4" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="290.0" y1="260.0" x2="299.0" y2="264.4" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="299.0" y1="264.4" x2="299.0" y2="274.4" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<circle cx="236.5" cy="344.2" r="2.8" fill="#2e8b57"/>
<text x="200.5" y="350.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2e8b57" font-style="italic">u′<tspan dy="4" font-size="70%">y</tspan><tspan dy="-4"></tspan></text>
<text x="241.1" y="355.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e8b57" font-style="italic">direzione di proiezione</text>
<text x="20" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">x e z stanno sul quadro: coincidono con x′ e z′, unità vere e angolo di 90 gradi (il prospetto</text>
<text x="20" y="517" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">resta in vera forma). Solo y, che sporge dal quadro, viene proiettato: y′ è inclinato e l'unità</text>
<text x="20" y="534" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">su y′ può ridursi o crescere. Il triangolo verde (O, Uy, u′y) è la «squadretta» da ribaltare.</text>
</g>
</svg>
