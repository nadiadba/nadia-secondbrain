<text x="330.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" text-anchor="start">La scala grafica si disegna accanto</text>
<text x="330.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" text-anchor="start">al disegno: se il foglio viene ridotto</text>
<text x="330.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" text-anchor="start">o fotocopiato, si riduce insieme a lui</text>
