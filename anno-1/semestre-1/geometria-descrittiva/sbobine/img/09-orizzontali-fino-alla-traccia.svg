<text x="130.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7b4fa0">quota 60</text>
<text x="20" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Ogni orizzontale ha o₂ parallela alla LT e o₁ parallela a t₁α. Quando la quota arriva a zero</text>
<text x="20" y="489" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">l'orizzontale sta su π₁ e coincide con la prima traccia: t₁α è l'orizzontale a quota zero.</text>
