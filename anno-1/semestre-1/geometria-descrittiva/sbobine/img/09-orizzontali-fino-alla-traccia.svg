<text x="484.0" y="29.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan>α</text>
<line x1="80.0" y1="225.0" x2="480.0" y2="445.0" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
<text x="490.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan>α ≡ o₁ a quota 0</text>
<line x1="400.0" y1="65.0" x2="580.0" y2="65.0" stroke="#2e8b57" stroke-width="1.8" stroke-linecap="round"/>
