<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 416" width="600" height="416">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Le squadrette lavorano in coppia: una sta ferma, l'altra scorre</text>
<g transform="translate(0,36)">
<polygon points="70.0,250.0 450.0,250.0 70.0,325.0" fill="#8a8a8a" fill-opacity="0.18" stroke="#8a8a8a" stroke-width="1.6" stroke-linejoin="round"/>
<text x="110.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="start">squadretta ferma</text>
<polygon points="250.0,250.0 370.0,250.0 250.0,130.0" fill="#2563a8" fill-opacity="0.05" stroke="#2563a8" stroke-width="1.2" stroke-dasharray="5,4" stroke-linejoin="round"/>
<polygon points="120.0,250.0 240.0,250.0 120.0,130.0" fill="#2563a8" fill-opacity="0.15" stroke="#2563a8" stroke-width="1.8" stroke-linejoin="round"/>
<text x="128.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563a8" text-anchor="start">squadretta</text>
<text x="128.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563a8" text-anchor="start">che scorre</text>
<line x1="180.0" y1="268.0" x2="300.0" y2="268.0" stroke="#2563a8" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="300.0,268.0 291.0,272.1 291.0,263.9" fill="#2563a8" fill-opacity="1" stroke="none" stroke-linejoin="round"/>
<line x1="244.2" y1="254.2" x2="84.6" y2="94.6" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<text x="80.6" y="88.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic" text-anchor="start">r</text>
<line x1="374.2" y1="254.2" x2="214.6" y2="94.6" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<text x="210.6" y="88.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic" text-anchor="start">r′</text>
<line x1="250.0" y1="250.0" x2="250.0" y2="60.0" stroke="#2e8b57" stroke-width="2" stroke-linecap="round"/>
<text x="256.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e8b57" font-style="italic" text-anchor="start">s ⊥ bordo</text>
<line x1="250.0" y1="240.0" x2="260.0" y2="240.0" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="260.0" y1="240.0" x2="260.0" y2="250.0" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<text x="420.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic" text-anchor="start">r ∥ r′</text>
<text x="16" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Si tiene ferma una squadretta e si fa scorrere l'altra lungo il suo bordo:</text>
<text x="16" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">l'ipotenusa traccia rette parallele (r, r′), il cateto verticale una perpendicolare (s).</text>
</g>
</svg>
