<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 326" width="620" height="326">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">La serie A: ogni formato è formato da due fogli del formato più piccolo</text>
<g transform="translate(0,36)">
<polygon points="40.0,30.0 346.8,30.0 346.8,248.4 40.0,248.4" fill="#2563a8" fill-opacity="0.04" stroke="#1f1f1f" stroke-width="2" stroke-linejoin="round"/>
<line x1="193.4" y1="30.0" x2="193.4" y2="248.4" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
<line x1="40.0" y1="139.2" x2="193.4" y2="139.2" stroke="#1f1f1f" stroke-width="1.4" stroke-linecap="round"/>
<line x1="116.7" y1="139.2" x2="116.7" y2="248.4" stroke="#1f1f1f" stroke-width="1.2" stroke-linecap="round"/>
<line x1="40.0" y1="193.8" x2="116.7" y2="193.8" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<polygon points="40.0,193.8 116.7,193.8 116.7,248.4 40.0,248.4" fill="#c0392b" fill-opacity="0.12" stroke="none" stroke-linejoin="round"/>
<text x="270.1" y="131.2" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2563a8" font-weight="bold" text-anchor="middle">A1</text>
<text x="270.1" y="153.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">59,4 × 84</text>
<text x="116.7" y="78.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2563a8" font-weight="bold" text-anchor="middle">A2</text>
<text x="116.7" y="98.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">42 × 59,4</text>
<text x="155.1" y="187.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2563a8" font-weight="bold" text-anchor="middle">A3</text>
<text x="155.1" y="205.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">29,7 × 42</text>
<text x="78.3" y="217.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">A4</text>
<text x="78.3" y="235.1" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">21 × 29,7</text>
<text x="78.3" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">A4</text>
<text x="366.8" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">Tutto il foglio è il formato</text>
<text x="366.8" y="79.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">più grande: 84 × 118 cm (A0),</text>
<text x="366.8" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">superficie circa 1 m².</text>
<text x="366.8" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start"></text>
<text x="366.8" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">Si dimezza ogni volta il lato</text>
<text x="366.8" y="155.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">maggiore: A0 → A1 → A2 → A3 → A4.</text>
<text x="20" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Misure in centimetri. Il lato minore di un formato è il lato maggiore del formato più piccolo.</text>
</g>
</svg>
