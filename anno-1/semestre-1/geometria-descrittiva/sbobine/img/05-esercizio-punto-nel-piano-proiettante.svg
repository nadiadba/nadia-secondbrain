<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" width="560" height="396">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Esercizio: P ∈ α, dimostrando che P ∈ r ⊂ α (α proiettante in prima)</text>
<g transform="translate(0,36)">
<line x1="20.0" y1="175.0" x2="530.0" y2="175.0" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="22.0" y="169.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">LT</text>
<line x1="150.0" y1="175.0" x2="150.0" y2="10.0" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
<text x="156.0" y="16.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan>α</text>
<line x1="150.0" y1="175.0" x2="460.0" y2="325.0" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
<text x="464.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan>α</text>
<line x1="159.0" y1="175.0" x2="159.0" y2="166.0" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="159.0" y1="166.0" x2="150.0" y2="166.0" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="330.0" y1="175.0" x2="330.0" y2="15.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<text x="336.0" y="19.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r₂</text>
<text x="336.0" y="37.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">T<tspan dy="4" font-size="70%">2r</tspan><tspan dy="-4"></tspan>∞</text>
<line x1="330.0" y1="175.0" x2="330.0" y2="262.1" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="330.0" cy="262.1" r="2.8" fill="#c0392b"/>
<text x="180.0" y="266.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r₁ ≡ T<tspan dy="4" font-size="70%">1r</tspan><tspan dy="-4"></tspan> ≡ P₁</text>
<circle cx="330.0" cy="65.0" r="2.8" fill="#c0392b"/>
<text x="336.0" y="59.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">P₂</text>
<line x1="150.0" y1="65.0" x2="410.0" y2="65.0" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
<text x="414.0" y="69.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">o₂</text>
<circle cx="150.0" cy="65.0" r="2.8" fill="#1f1f1f"/>
<text x="110.0" y="61.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">T<tspan dy="4" font-size="70%">2o</tspan><tspan dy="-4"></tspan></text>
<text x="390.0" y="299.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">o₁ ≡ t₁α</text>
<text x="20" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">T₁ᵣ sta su t₁α, quindi r ⊂ α; P sta su r, quindi P ∈ α. Lo conferma l'orizzontale o: T₂ₒ sta su t₂α.</text>
</g>
</svg>
