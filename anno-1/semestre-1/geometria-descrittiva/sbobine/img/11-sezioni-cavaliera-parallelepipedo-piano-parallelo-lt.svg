<text x="18" y="583" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. La retta r = α ∩ β: parte da t₃′α ∩ t₃′β ed è parallela a x′ (cioè alla LT).</text>
<text x="18" y="605" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. I punti dove r′ taglia gli spigoli della faccia anteriore: 1 e 2.</text>
<text x="18" y="627" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lo stesso con il piano γ della faccia posteriore: m′, punti 3 e 4. Sul fianco basta unire 4 e 1.</text>
