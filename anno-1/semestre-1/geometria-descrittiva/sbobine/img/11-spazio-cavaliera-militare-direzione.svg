<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 465" width="620" height="465">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Cavaliera militare nello spazio: il quadro è π₁</text>
<g transform="translate(0,36)">
<text x="18" y="379" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">In verde la «squadretta» a 45°: un cateto è u sull'asse z, l'altro sta sul quadro ed è u′z = u.</text>
<text x="18" y="401" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Se la direzione di proiezione è più ripida u′z si accorcia (arancio), se è più inclinata si allunga (viola).</text>
<polygon points="587.2,240.0 310.0,134.7 32.8,240.0 310.0,345.3" fill="#9aa5b1" fill-opacity="0.12" stroke="#9aa5b1" stroke-width="1.8"/>
<text x="324.0" y="329.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a8a8a" font-style="italic">π<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan> = quadro</text>
<line x1="329.8" y1="240.0" x2="181.3" y2="183.6" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="329.8" y1="240.0" x2="181.3" y2="296.4" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="329.8" y1="240.0" x2="329.8" y2="30.0" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="320.5" y1="236.4" x2="311.1" y2="240.0" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="311.1" y1="240.0" x2="320.5" y2="243.6" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<text x="161.3" y="203.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">x ≡ x′</text>
<text x="131.3" y="290.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">y ≡ y′</text>
<text x="335.8" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">z</text>
<circle cx="329.8" cy="240.0" r="2.8" fill="#1f1f1f"/>
<text x="299.8" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">O ≡ O′</text>
<circle cx="230.8" cy="202.4" r="2.8" fill="#1f1f1f"/>
<text x="226.8" y="220.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">u</text>
<circle cx="230.8" cy="277.6" r="2.8" fill="#1f1f1f"/>
<text x="226.8" y="269.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">u</text>
<circle cx="329.8" cy="100.0" r="2.8" fill="#1f1f1f"/>
<text x="299.8" y="104.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">U<tspan dy="4" font-size="70%">z</tspan><tspan dy="-4"></tspan></text>
<line x1="329.8" y1="240.0" x2="559.7" y2="216.6" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<text x="565.7" y="220.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">z′</text>
<polygon points="329.8,240.0 329.8,100.0 465.0,226.2" fill="#2e8b57" fill-opacity="0.12" stroke="#2e8b57" stroke-width="1.8"/>
<line x1="329.8" y1="100.0" x2="465.0" y2="226.2" stroke="#2e8b57" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="465.0" cy="226.2" r="2.8" fill="#2e8b57"/>
<line x1="329.8" y1="100.0" x2="410.9" y2="231.7" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="410.9" cy="231.7" r="2.8" fill="#d97706"/>
<line x1="329.8" y1="100.0" x2="525.9" y2="220.0" stroke="#7b4fa0" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="525.9" cy="220.0" r="2.8" fill="#7b4fa0"/>
<text x="415.0" y="276.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2e8b57" font-style="italic">45°: u′<tspan dy="4" font-size="70%">z</tspan><tspan dy="-4"></tspan> = u</text>
<text x="380.9" y="257.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d97706" font-style="italic">u′<tspan dy="4" font-size="70%">z</tspan><tspan dy="-4"></tspan> &lt; u</text>
<text x="525.9" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">u′<tspan dy="4" font-size="70%">z</tspan><tspan dy="-4"></tspan> &gt; u</text>
<line x1="329.8" y1="231.0" x2="338.8" y2="230.1" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
<line x1="338.8" y1="230.1" x2="338.8" y2="239.1" stroke="#1f1f1f" stroke-width="1" stroke-linecap="round"/>
</g>
</svg>
