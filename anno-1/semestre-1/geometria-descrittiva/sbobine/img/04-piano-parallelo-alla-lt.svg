<text x="20" y="380" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">t₁α e t₂α sono parallele alla LT, t₃α è inclinata; r appartiene ad α perché T₃ᵣ sta su t₃α.</text>
