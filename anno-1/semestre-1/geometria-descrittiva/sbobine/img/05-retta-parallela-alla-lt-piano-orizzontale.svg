<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Retta r parallela alla LT: anche il piano orizzontale la contiene (dal quaderno di Marta)</text>
<g transform="translate(0,36)">
<line x1="20.0" y1="150.0" x2="530.0" y2="150.0" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="22.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">LT</text>
<line x1="20.0" y1="60.0" x2="530.0" y2="60.0" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
<line x1="90.0" y1="60.0" x2="470.0" y2="60.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<text x="460.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan>α ≡ r₂</text>
<line x1="90.0" y1="220.0" x2="470.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
<text x="476.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r₁</text>
<text x="330.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan>α∞</text>
<line x1="280.0" y1="60.0" x2="280.0" y2="220.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="280.0" cy="60.0" r="2.8" fill="#c0392b"/>
<text x="284.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">P₂</text>
<circle cx="280.0" cy="220.0" r="2.8" fill="#c0392b"/>
<text x="286.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">P₁</text>
<text x="20" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Piano orizzontale α: la seconda traccia è parallela alla LT e coincide con r₂; la prima traccia è all'infinito.</text>
</g>
</svg>
