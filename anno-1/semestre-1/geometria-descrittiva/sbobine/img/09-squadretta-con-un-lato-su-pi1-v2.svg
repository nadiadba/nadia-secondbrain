<text x="20" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">A e B stanno su π₁: A₂ e B₂ sono sulla LT, A₁B₁ sta sulla prima traccia ed è l'asse di rotazione.</text>
<text x="20" y="467" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Si ribalta solo C (stessa costruzione: γ, C̄ con la quota di C, raggio HC̄): A*B*C* è la</text>
<text x="20" y="484" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">squadretta in vera forma: angolo retto in A, 30° in B, 60° in C.</text>
