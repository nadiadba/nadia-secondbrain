<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" width="640" height="436">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Il formato A4: il lato maggiore è la diagonale del quadrato sul lato minore</text>
<g transform="translate(0,36)">
<polygon points="130.0,360.0 361.0,360.0 361.0,33.3 130.0,33.3" fill="#2563a8" fill-opacity="0.06" stroke="#2563a8" stroke-width="2" stroke-linejoin="round"/>
<line x1="130.0" y1="129.0" x2="361.0" y2="129.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="130.0" y1="360.0" x2="361.0" y2="129.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 361.0 129.0 L 356.4 124.5 L 351.8 120.1 L 347.0 115.8 L 342.2 111.6 L 337.3 107.5 L 332.3 103.4 L 327.2 99.5 L 322.0 95.7 L 316.8 92.0 L 311.5 88.4 L 306.1 84.8 L 300.7 81.4 L 295.2 78.1 L 289.6 75.0 L 284.0 71.9 L 278.3 68.9 L 272.6 66.1 L 266.8 63.3 L 260.9 60.7 L 255.0 58.2 L 249.1 55.8 L 243.1 53.5 L 237.0 51.3 L 231.0 49.3 L 224.8 47.4 L 218.7 45.6 L 212.5 43.9 L 206.3 42.3 L 200.0 40.9 L 193.7 39.6 L 187.4 38.4 L 181.1 37.3 L 174.8 36.4 L 168.4 35.6 L 162.0 34.9 L 155.6 34.3 L 149.2 33.9 L 142.8 33.6 L 136.4 33.4 L 130.0 33.3" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="245.5" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="middle">l = 21 cm</text>
<text x="120.0" y="196.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end">d = 29,7 cm</text>
<text x="250.1" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic" text-anchor="start">d</text>
<text x="353.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end">quadrato l × l</text>
<text x="245.5" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2563a8" font-weight="bold" text-anchor="middle">A4</text>
<text x="390.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">1. Sul lato minore l si costruisce</text>
<text x="390.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">    un quadrato.</text>
<text x="390.0" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">2. Si traccia la diagonale d del quadrato.</text>
<text x="390.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">3. Con centro nell'angolo si ruota d</text>
<text x="390.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">    fino al lato verticale: lì finisce</text>
<text x="390.0" y="230.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">    il lato maggiore del foglio.</text>
<text x="390.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start"></text>
<text x="390.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">d = l · √2   (29,7 ≈ 21 × 1,414)</text>
</g>
</svg>
