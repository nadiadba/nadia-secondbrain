<text x="136.0" y="21.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan>δ</text>
<line x1="130.0" y1="190.0" x2="462.3" y2="328.5" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
