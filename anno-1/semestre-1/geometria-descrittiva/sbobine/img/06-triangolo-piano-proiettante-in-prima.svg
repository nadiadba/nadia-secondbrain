<text x="16" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Tutta la figura ha la prima proiezione su t₁δ: B₁ ≡ C₁, e BC non è più</text>
<text x="16" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">di profilo ma proiettante in prima. AB resta orizzontale (A₂B₂ ∥ LT).</text>
