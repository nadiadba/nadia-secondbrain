<line x1="492.0" y1="315.2" x2="451.7" y2="274.1" stroke="#1e90c8" stroke-width="1.8" stroke-linecap="round"/>
<text x="500.0" y="315.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e90c8" font-style="italic">verso il centro</text>
<text x="500.0" y="331.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e90c8" font-style="italic">(all'infinito)</text>
<text x="20" y="462" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. Il prospetto si disegna in vera forma sul quadro, con segno leggero (non va calcato): il solido</text>
<text x="20" y="479" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">   gli starà davanti e lo coprirà in parte.</text>
<text x="20" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. La pianta si ribalta sotto x′, girandola intorno a x′ (retta comune a π₁ e quadro): A₁*B₁*C₁*D₁*.</text>
<text x="20" y="513" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">   Qui il solido è staccato dal quadro: la profondità parte da y₀ su y* e si porta su y′.</text>
<text x="20" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. Affinità di asse x′: y* e y′ si corrispondono (si incontrano sull'asse in O′); i punti</text>
<text x="20" y="547" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">   corrispondenti sono allineati con il centro, all'infinito (linee grigie tratteggiate).</text>
<text x="20" y="564" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">4. r₁* = A₁*B₁* è parallela a y*, quindi r₁′ è parallela a y′; B₁′ sta nella direzione del centro.</text>
<text x="20" y="581" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">   B₁*C₁* è parallela all'asse, quindi B₁′C₁′ è parallela all'asse. Si chiude la pianta assonometrica.</text>
<text x="20" y="598" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">5. Dai vertici si alzano gli spigoli paralleli a z′: l'altezza non cambia. In rosso il solido.</text>
</g>
</svg>
