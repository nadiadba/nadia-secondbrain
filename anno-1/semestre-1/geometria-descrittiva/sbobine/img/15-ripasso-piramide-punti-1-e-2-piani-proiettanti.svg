<text x="14" y="548" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">Punto 2: γ proiettante in seconda contiene VA; s = α ∩ γ, e dove s₁ taglia V₁A₁ c'è 2₁ (poi 2₂ con il richiamo).</text>
