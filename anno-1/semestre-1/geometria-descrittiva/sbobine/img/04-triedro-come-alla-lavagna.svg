<text x="364.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#8a8a8a">π₁ ∩ π₃</text>
<text x="16" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La LT è l'intersezione tra π₁ e π₂. Lo schema rimanda al modello:</text>
<text x="16" y="488" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">la pianta mantiene la sua forma, gli angoli di 90° restano di 90°.</text>
