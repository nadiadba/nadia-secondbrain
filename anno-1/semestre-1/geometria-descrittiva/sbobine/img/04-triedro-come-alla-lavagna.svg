<text x="216.2" y="335.4" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a">π<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan></text>
<text x="172.3" y="154.7" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a">π<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan></text>
<text x="321.4" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8a8a8a">π<tspan dy="4" font-size="70%">3</tspan><tspan dy="-4"></tspan></text>
<text x="76.2" y="321.8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#1f1f1f">LT</text>
