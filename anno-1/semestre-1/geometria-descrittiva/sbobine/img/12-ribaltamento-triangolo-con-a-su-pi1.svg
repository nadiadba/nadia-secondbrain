<text x="20" y="520" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. A₂ sta sulla LT: A è già su π₁, quindi la prima traccia del piano passa per A₁.</text>
<text x="20" y="537" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. r è la retta del lato BC: la sua prima traccia T₁ᵣ. t₁α = A₁T₁ᵣ è l'asse di rotazione.</text>
<text x="20" y="554" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. Ruota B: perpendicolare a t₁α da B₁, si ribalta la quota di B (B̄); il «raggio» di rotazione</text>
<text x="20" y="571" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    si riporta sulla perpendicolare e si trova B*.</text>
<text x="20" y="588" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">4. Affinità ortogonale di asse t₁α: r* passa per T₁ᵣ e B*; C* sta sulla perpendicolare all'asse da C₁.</text>
<text x="20" y="605" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    A non si muove: A₁ ≡ A*.</text>
