<text x="16" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Da L₁ e M₁ si richiamano L₂ e M₂ sui lati: n₂ = L₂M₂. Dove n₂ incontra r₂ c'è P₂; P₁ sta su r₁.</text>
