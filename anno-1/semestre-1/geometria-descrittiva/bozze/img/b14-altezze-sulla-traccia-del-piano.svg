<text x="16" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La traccia del piano α è la verticale per Tᵣ′. Su di essa si stacca H vera dalla fondamentale; da lì si va verso Fᵣ</text>
<text x="16" y="348" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">e si trovano le cime degli spigoli per A′ e B′. Poi: cima di B′ verso Fₙ fino allo spigolo per C′; le fughe chiudono il solido.</text>
