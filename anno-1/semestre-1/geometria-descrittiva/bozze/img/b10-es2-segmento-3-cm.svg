<text x="16" y="590" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. Q nel triangolo con l'orizzontale o; f frontale per Q.  2. r per Q: r₁ ⊥ o₁, r₂ ⊥ f₂.</text>
<text x="16" y="607" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. Un punto qualunque S di r; γ (t₁γ ≡ r₁) si ribalta su π₁: Q* e S* con le quote; r* = Q*S*.</text>
<text x="16" y="624" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">4. Su r* si misurano 3 cm: E*.  5. A ritroso: da E* perpendicolare a r₁ → E₁; richiamo → E₂ su r₂.</text>
