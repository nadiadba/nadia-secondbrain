<text x="20" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">A e B stanno su π₁: A₂ e B₂ sono sulla LT e A₁B₁ sta sulla prima traccia: è l'asse di rotazione.</text>
<text x="20" y="437" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Si ribalta solo C: t₁γ ⊥ t₁α per C₁, C̄ con la quota di C (due lineette), centro H, raggio HC̄.</text>
<text x="20" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">A*B*C* è la squadretta in vera forma: angolo retto in A, 30° in B, 60° in C (misure scelte qui).</text>
