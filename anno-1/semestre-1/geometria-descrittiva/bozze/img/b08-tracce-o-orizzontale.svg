<text x="20" y="495" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Con le tracce: le prime tracce delle rette r = AB e s = BC stanno su t₁α, e due punti bastano.</text>
<text x="20" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Con l'orizzontale: o₂ per C₂ parallela alla LT incontra A₂B₂ in M₂; M₁ sta su A₁B₁;</text>
<text x="20" y="529" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">o₁ passa per C₁ e M₁ ed è parallela a t₁α. La traccia del piano non serve.</text>
