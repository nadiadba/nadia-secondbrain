<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" width="800" height="346">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Passo 1 · orizzonte, fondamentale, O₀, O*; si sceglie Fᵣ, la traccia Tᵣ′ e A′ su r′</text>
<g transform="translate(0,36)">
<line x1="10.0" y1="50.0" x2="790.0" y2="50.0" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="12.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f1f1f">orizzonte</text>
<line x1="10.0" y1="140.0" x2="790.0" y2="140.0" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="12.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f1f1f">fondamentale</text>
<circle cx="420.0" cy="50.0" r="2.8" fill="#1f1f1f"/>
<text x="424.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">O<tspan dy="4" font-size="70%">0</tspan><tspan dy="-4"></tspan></text>
<line x1="420.0" y1="50.0" x2="420.0" y2="220.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="420.0" cy="220.0" r="2.8" fill="#1f1f1f"/>
<text x="428.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">O*</text>
<circle cx="622.6" cy="50.0" r="2.8" fill="#1f1f1f"/>
<text x="626.6" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">F<tspan dy="4" font-size="70%">r</tspan><tspan dy="-4"></tspan></text>
<line x1="340.0" y1="140.0" x2="622.6" y2="50.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<circle cx="340.0" cy="140.0" r="2.8" fill="#c0392b"/>
<text x="310.0" y="158.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">T<tspan dy="4" font-size="70%">r</tspan><tspan dy="-4"></tspan>′</text>
<text x="547.3" y="59.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r′</text>
<circle cx="384.9" cy="125.7" r="2.8" fill="#c0392b"/>
<text x="374.9" y="115.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">A′</text>
<text x="16" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Fᵣ sta sull'orizzonte (è una fuga), Tᵣ′ sulla fondamentale (è una traccia). r′ le congiunge; A′ si sceglie su r′,</text>
<text x="16" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">non troppo vicino all'orizzonte, se no il disegno si schiaccia.</text>
</g>
</svg>
