<text x="273.9" y="165.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#2e8b57">γ</text>
<text x="20" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">γ è proiettante in prima e passa per P; t₁γ ⊥ t₁α, quindi γ ⊥ α. m = α ∩ γ, H = t₁γ ∩ t₁α.</text>
<text x="20" y="517" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Arancio: γ si ribalta su π₁ intorno a t₁γ e porta con sé m e la quota di P (P̄).</text>
<text x="20" y="534" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Rosso: α ruota intorno a t₁α; P percorre su γ un arco di centro H e raggio HP = HP̄, fino a P*.</text>
