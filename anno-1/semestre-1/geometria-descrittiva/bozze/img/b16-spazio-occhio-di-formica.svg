<text x="16" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">L'occhio è sul geometrale: l'orizzonte cade sulla fondamentale e tutto il solido si vede sopra di essa;</text>
<text x="16" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">la base si schiaccia sulla linea. Le altezze vere si portano, come sempre, sulla traccia tα del piano</text>
<text x="16" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">verticale della faccia, partendo dall'orizzonte.</text>
