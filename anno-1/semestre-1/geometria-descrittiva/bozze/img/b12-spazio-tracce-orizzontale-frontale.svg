<text x="20" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">L'orizzontale o sta alla quota di A ed è parallela a t₁α; la frontale f sta all'aggetto di A ed è</text>
<text x="20" y="469" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">parallela a t₂α. Per questo t₁α passa per T₁f ed è parallela a o₁, t₂α passa per T₂o ed è</text>
<text x="20" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">parallela a f₂: le due tracce si incontrano sulla LT.</text>
