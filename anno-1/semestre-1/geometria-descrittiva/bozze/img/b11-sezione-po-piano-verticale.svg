<text x="16" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">β (faccia anteriore) e γ (faccia posteriore) sono proiettanti in prima, come il piano secante α.</text>
<text x="16" y="485" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r = α ∩ β è verticale: r₁ ≡ T₁ᵣ, r₂ ⊥ LT (T₂ᵣ all'infinito); taglia gli spigoli orizzontali in 1 e 2.</text>
<text x="16" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lo stesso con γ: m dà 3 e 4. In pianta la sezione è il segmento T₁ᵣT₁ₘ su t₁α, che si rinforza.</text>
