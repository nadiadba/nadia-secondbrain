<text x="20" y="585" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Ogni faccia ha il lato di base su π₁, come la squadretta: si ribalta solo V, intorno a quel lato.</text>
<text x="20" y="602" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Per la faccia DE: t₁γ ⊥ DE per V₁; V̄ con l'altezza h (due lineette); centro H, raggio HV̄: V*.</text>
<text x="20" y="619" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Facendo lo stesso per le altre facce, verso l'esterno, si ottiene lo sviluppo: base + 4 facce.</text>
<text x="20" y="636" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">(Schema proposto: le misure della piramide sono scelte qui.)</text>
