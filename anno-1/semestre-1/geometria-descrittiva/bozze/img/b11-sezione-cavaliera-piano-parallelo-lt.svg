<text x="16" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. Il piano β della faccia anteriore: t₁′β parallela a x′, t₃′β parallela a z′.</text>
<text x="16" y="600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. r = α ∩ β parte da dove t₃′α incontra t₃′β ed è parallela a x′. 3. r′ taglia gli spigoli della faccia in 1 e 2.</text>
<text x="16" y="620" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lo stesso con γ (faccia posteriore): m′ dà 3 e 4. La sezione 1-2-3-4 si ripassa e si campisce.</text>
