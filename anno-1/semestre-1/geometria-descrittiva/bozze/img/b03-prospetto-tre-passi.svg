<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Perché il prospetto del lato in alto si disegna a testa in giù</text><text x="160" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">1. Chi guarda il lato in alto</text><text x="160" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">sta fuori, sopra la pianta, e guarda verso il basso</text><circle cx="160" cy="170" r="9" fill="#2e7d32"/><line x1="160" y1="182" x2="160" y2="218" stroke="#2e7d32" stroke-width="2.5"/><line x1="153" y1="210" x2="160" y2="218" stroke="#2e7d32" stroke-width="2.5"/><line x1="167" y1="210" x2="160" y2="218" stroke="#2e7d32" stroke-width="2.5"/><text x="160" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle">chi guarda</text><text x="45" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">← la sua destra</text><text x="275" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="end">la sua sinistra →</text><polygon points="25,340 120,340 120,300 295,300 295,450 25,450" fill="#e6e7ea" stroke="#222" stroke-width="2"/><text x="160" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">pianta</text><text x="72" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">rientranza</text><text x="160" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">La rientranza, per lui, è a destra</text><text x="160" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">(sul foglio sembra a sinistra perché</text><text x="160" y="524" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">lui è girato verso di te)</text><text x="485" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">2. Si disegna dalla sua parte</text><text x="485" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">LT in alto, prospetto appeso alla LT</text><line x1="340" y1="150" x2="640" y2="150" stroke="#222" stroke-width="2.4"/><text x="340" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" text-anchor="start">LT</text><polygon points="350,150 445,150 445,230 350,230" fill="#ffffff" stroke="#222" stroke-width="2"/><polygon points="445,150 620,150 620,285 445,285" fill="#ffffff" stroke="#222" stroke-width="2"/><polygon points="380,165 415,165 415,195 380,195" fill="#d6e4f0" stroke="#222" stroke-width="1"/><polygon points="510,180 565,180 565,220 510,220" fill="#d6e4f0" stroke="#222" stroke-width="1"/><line x1="350" y1="150" x2="350" y2="340" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/><line x1="445" y1="150" x2="445" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/><line x1="620" y1="150" x2="620" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/><text x="397" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">rientranza</text><polygon points="350,340 445,340 445,300 620,300 620,450 350,450" fill="#e6e7ea" stroke="#222" stroke-width="2"/><text x="485" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">pianta</text><text x="485" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">Dal tuo posto il prospetto</text><text x="485" y="506" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">è a testa in giù: è giusto così</text><text x="810" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">3. Gira il foglio</text><text x="810" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">ora sei tu al posto di chi guarda</text><polygon points="945,260 850,260 850,300 675,300 675,150 945,150" fill="#e6e7ea" stroke="#222" stroke-width="2"/><text x="810" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">pianta</text><line x1="945" y1="450" x2="945" y2="260" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/><line x1="850" y1="450" x2="850" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/><line x1="675" y1="450" x2="675" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/><polygon points="945,450 850,450 850,370 945,370" fill="#ffffff" stroke="#222" stroke-width="2"/><polygon points="850,450 675,450 675,315 850,315" fill="#ffffff" stroke="#222" stroke-width="2"/><polygon points="915,435 880,435 880,405 915,405" fill="#d6e4f0" stroke="#222" stroke-width="1"/><polygon points="785,420 730,420 730,380 785,380" fill="#d6e4f0" stroke="#222" stroke-width="1"/><line x1="665" y1="450" x2="965" y2="450" stroke="#222" stroke-width="2.4"/><text x="965" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" text-anchor="end">LT</text><text x="898" y="362" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">rientranza</text><circle cx="810" cy="560" r="9" fill="#2e7d32"/><line x1="810" y1="548" x2="810" y2="512" stroke="#2e7d32" stroke-width="2.5"/><line x1="803" y1="520" x2="810" y2="512" stroke="#2e7d32" stroke-width="2.5"/><line x1="817" y1="520" x2="810" y2="512" stroke="#2e7d32" stroke-width="2.5"/><text x="810" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle">tu</text><text x="810" y="620" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Il prospetto è dritto e la rientranza è a destra:</text><text x="810" y="636" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">è proprio quello che vede chi guarda quel lato</text></svg>