<line x1="60.0" y1="250.0" x2="495.0" y2="489.2" stroke="#1f1f1f" stroke-width="2.4" stroke-linecap="round"/>
<text x="499.0" y="501.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">t<tspan dy="4" font-size="70%">1</tspan><tspan dy="-4"></tspan>α</text>
<line x1="92.5" y1="327.5" x2="480.0" y2="250.0" stroke="#7b4fa0" stroke-width="2.4" stroke-linecap="round"/>
<line x1="480.0" y1="250.0" x2="480.0" y2="10.0" stroke="#7b4fa0" stroke-width="2.4" stroke-linecap="round"/>
<text x="446.0" y="18.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">t<tspan dy="4" font-size="70%">2</tspan><tspan dy="-4"></tspan>γ</text>
<line x1="160.0" y1="314.0" x2="400.0" y2="266.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="160.0" y1="136.4" x2="400.0" y2="216.4" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
<text x="138.0" y="136.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r₂</text>
<text x="327.5" y="304.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">r₁ ≡ t₁γ ≡ n₁</text>
<line x1="172.0" y1="250.0" x2="172.0" y2="311.6" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
