<text x="426.4" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">n₂</text>
<circle cx="172.0" cy="311.6" r="2.8" fill="#7b4fa0"/>
<text x="162.0" y="337.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">T<tspan dy="4" font-size="70%">1n</tspan><tspan dy="-4"></tspan></text>
