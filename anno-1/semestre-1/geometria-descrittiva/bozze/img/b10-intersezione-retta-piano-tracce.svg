<text x="100.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">(T<tspan dy="4" font-size="70%">1n</tspan><tspan dy="-4"></tspan>)₂</text>
<circle cx="480.0" cy="40.0" r="2.8" fill="#7b4fa0"/>
<text x="488.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">T<tspan dy="4" font-size="70%">2n</tspan><tspan dy="-4"></tspan></text>
<circle cx="480.0" cy="250.0" r="2.8" fill="#7b4fa0"/>
<text x="486.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b4fa0" font-style="italic">(T<tspan dy="4" font-size="70%">2n</tspan><tspan dy="-4"></tspan>)₁</text>
<line x1="280.0" y1="176.4" x2="280.0" y2="290.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="280.0" cy="176.4" r="2.8" fill="#1f1f1f"/>
<text x="275.0" y="160.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">P₂</text>
<circle cx="280.0" cy="290.0" r="2.8" fill="#1f1f1f"/>
<text x="272.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">P₁</text>
<text x="16" y="518" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">γ proiettante in prima per r: t₁γ ≡ r₁. n = α ∩ γ: T₁ₙ = t₁α ∩ t₁γ, T₂ₙ = t₂α ∩ t₂γ, n₁ ≡ t₁γ.</text>
<text x="16" y="535" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">n₂ unisce T₂ₙ e (T₁ₙ)₂. Dove n₂ incontra r₂ c'è P₂; P₁ sta su r₁, sulla linea di richiamo.</text>
</g>
