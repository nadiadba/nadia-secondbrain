<text x="16" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il piano γ è verticale (proiettante in prima) e contiene r. n = α ∩ γ va da T₁ₙ a T₂ₙ;</text>
<text x="16" y="517" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r e n stanno tutte e due su γ, quindi si incontrano: il punto comune P è il punto in cui r buca α.</text>
