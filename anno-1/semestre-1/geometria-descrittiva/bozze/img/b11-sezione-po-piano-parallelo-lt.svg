<text x="16" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">In terza proiezione α si vede di taglio: r₃ è dove t₃α incontra t₃δ, m₃ dove incontra t₃γ.</text>
<text x="16" y="480" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r ed m sono parallele alla LT (r₁ ≡ t₁δ, m₁ ≡ t₁γ): r₂ e m₂ tagliano gli spigoli in 1, 2 e 3, 4.</text>
<text x="16" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La sezione si campisce; la parte di solido sopra α si elimina (in grigio).</text>
