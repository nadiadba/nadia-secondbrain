<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" width="600" height="376">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Retta r con le due tracce sotto la linea di terra</text>
<g transform="translate(0,36)">
<line x1="20.0" y1="150.0" x2="570.0" y2="150.0" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="22.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">LT</text>
<line x1="57.1" y1="104.5" x2="477.2" y2="238.2" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
<text x="39.1" y="104.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r₂</text>
<line x1="59.0" y1="281.3" x2="476.4" y2="129.5" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
<text x="41.0" y="289.3" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">r₁</text>
<line x1="200.0" y1="150.0" x2="200.0" y2="230.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="420.0" y1="150.0" x2="420.0" y2="220.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="200.0" cy="150.0" r="2.8" fill="#1f1f1f"/>
<text x="208.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">(T<tspan dy="4" font-size="70%">1r</tspan><tspan dy="-4"></tspan>)₂</text>
<circle cx="200.0" cy="230.0" r="2.8" fill="#1f1f1f"/>
<text x="206.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">T<tspan dy="4" font-size="70%">1r</tspan><tspan dy="-4"></tspan></text>
<circle cx="420.0" cy="150.0" r="2.8" fill="#1f1f1f"/>
<text x="348.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">(T<tspan dy="4" font-size="70%">2r</tspan><tspan dy="-4"></tspan>)₁</text>
<circle cx="420.0" cy="220.0" r="2.8" fill="#1f1f1f"/>
<text x="376.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">T<tspan dy="4" font-size="70%">2r</tspan><tspan dy="-4"></tspan></text>
<text x="16" y="314" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">T₁ᵣ: prima traccia, davanti a π₂ · T₂ᵣ: seconda traccia, sotto π₁ (la retta "viene da fuori").</text>
<text x="16" y="332" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il procedimento non cambia: si prolungano le proiezioni fino alla LT e si cercano i punti notevoli.</text>
</g>
</svg>
