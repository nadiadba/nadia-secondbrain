<text x="20" y="456" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il lato AB sta già su π₁: è la cerniera. A e B non si muovono; si ribalta solo C.</text>
<text x="20" y="473" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">C ruota intorno ad AB (arco rosso) e arriva in C*: A*B*C* è la squadretta in vera forma.</text>
