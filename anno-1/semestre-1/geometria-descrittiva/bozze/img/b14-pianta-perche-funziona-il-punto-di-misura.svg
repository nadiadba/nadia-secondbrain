<text x="16" y="334" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Triangolo FᵣOMᵣ: FᵣMᵣ = FᵣO (arco di centro Fᵣ). Triangolo TᵣAAᵣ: TᵣAᵣ = TᵣA (arco di centro Tᵣ).</text>
<text x="16" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">I due triangoli sono isosceli con i lati paralleli, quindi AAᵣ è parallela a OMᵣ: la retta AAᵣ ha la fuga in Mᵣ.</text>
<text x="16" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Sul foglio A′ sta allora sulla retta MᵣAᵣ, e Aᵣ è sulla fondamentale a distanza vera TᵣA dalla traccia.</text>
