<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" width="640" height="506">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Nello spazio: la retta r con T₂ᵣ sotto la linea di terra</text>
<g transform="translate(0,36)">
<polygon points="130.0,200.0 630.0,200.0 630.0,340.0 130.0,340.0" fill="#b9c6d6" fill-opacity="0.22" stroke="#9aa5b1" stroke-width="1"/>
<polygon points="130.0,200.0 630.0,200.0 558.0,252.8 58.0,252.8" fill="#9aa5b1" fill-opacity="0.16" stroke="#9aa5b1" stroke-width="1"/>
<polygon points="130.0,200.0 630.0,200.0 630.0,30.0 130.0,30.0" fill="#9aa5b1" fill-opacity="0.07" stroke="#b7bfc8" stroke-width="1"/>
<line x1="120.0" y1="200.0" x2="640.0" y2="200.0" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round"/>
<text x="646.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#1f1f1f">LT</text>
<text x="460.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#8a8a8a">π₂ sopra il pavimento</text>
<text x="460.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#8a8a8a">π₂ sotto il pavimento</text>
<text x="440.0" y="244.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#8a8a8a">π₁ (il pavimento)</text>
<line x1="500.0" y1="200.0" x2="52.0" y2="246.2" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/>
<text x="30.0" y="250.2" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#d97706">r₁</text>
<line x1="159.0" y1="161.5" x2="555.0" y2="287.5" stroke="#2563a8" stroke-width="1.6" stroke-linecap="round"/>
<text x="137.0" y="161.5" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#2563a8">r₂</text>
<line x1="64.8" y1="195.9" x2="244.0" y2="226.4" stroke="#c0392b" stroke-width="2.8" stroke-linecap="round"/>
<text x="48.8" y="197.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#c0392b">r</text>
<line x1="244.0" y1="226.4" x2="500.0" y2="270.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>
<line x1="500.0" y1="270.0" x2="551.2" y2="278.7" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,4" stroke-linecap="round"/>
<line x1="244.0" y1="226.4" x2="280.0" y2="200.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="500.0" y1="270.0" x2="500.0" y2="200.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="244.0" cy="226.4" r="2.8" fill="#c0392b"/>
<text x="236.0" y="248.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#c0392b">T<tspan dy="4" font-size="70%">1r</tspan><tspan dy="-4"></tspan></text>
<circle cx="500.0" cy="270.0" r="2.8" fill="#c0392b"/>
<text x="508.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#c0392b">T<tspan dy="4" font-size="70%">2r</tspan><tspan dy="-4"></tspan></text>
<circle cx="280.0" cy="200.0" r="2.8" fill="#1f1f1f"/>
<text x="216.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#1f1f1f">(T<tspan dy="4" font-size="70%">1r</tspan><tspan dy="-4"></tspan>)₂</text>
<circle cx="500.0" cy="200.0" r="2.8" fill="#1f1f1f"/>
<text x="504.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#1f1f1f">(T<tspan dy="4" font-size="70%">2r</tspan><tspan dy="-4"></tspan>)₁</text>
<text x="16" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r arriva da sopra il pavimento e lo buca in T₁ᵣ. Poi prosegue sotto (tratteggiata) e incontra</text>
<text x="16" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">la parete π₂ solo sotto il pavimento, in T₂ᵣ: per questo sul foglio T₂ᵣ cade sotto la LT.</text>
<text x="16" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">r₁ (arancio) è l'ombra di r sul pavimento, r₂ (blu) la sua immagine sulla parete.</text>
<text x="16" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Schema proposto, non disegnato a lezione.</text>
</g>
</svg>
