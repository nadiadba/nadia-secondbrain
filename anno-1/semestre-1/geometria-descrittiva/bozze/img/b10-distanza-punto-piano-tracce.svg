<text x="420.5" y="354.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2e8b57" font-style="italic">H*</text>
<text x="443.7" y="417.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e8b57">distanza vera</text>
<text x="16" y="528" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. r per P: r₁ ⊥ t₁α, r₂ ⊥ t₂α.  2. γ proiettante in prima per r (t₁γ ≡ r₁): n = α ∩ γ, H₂ = n₂ ∩ r₂.</text>
<text x="16" y="545" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. γ si ribalta su π₁ intorno a t₁γ: P* e H* stanno sulle perpendicolari a t₁γ, alla distanza</text>
<text x="16" y="562" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">della quota (una e due lineette). P*H* è la distanza di P da α in vera grandezza.</text>
