<text x="16" y="599" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">In verde la faccia xOy ribaltata intorno a XY, in arancio la faccia yOz ribaltata intorno a YZ:</text>
<text x="16" y="619" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">O* sta sulla semicirconferenza (angolo retto in O*) e sulla perpendicolare alla cerniera da O′.</text>
<text x="16" y="639" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">L'unità vera u* sugli assi ribaltati torna sugli assi con la perpendicolare alla cerniera: u′ è più corta.</text>
