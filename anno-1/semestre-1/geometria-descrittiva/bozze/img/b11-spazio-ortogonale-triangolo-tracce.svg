<text x="16" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il quadro (in blu) taglia gli assi in X, Y, Z: il triangolo XYZ è il triangolo delle tracce.</text>
<text x="16" y="506" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La proiettante da O è perpendicolare al quadro e lo buca in O′, l'ortocentro del triangolo;</text>
<text x="16" y="526" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">O′X, O′Y, O′Z sono gli assi x′, y′, z′ e stanno sulle altezze del triangolo.</text>
