<text x="16" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La faccia AB sta nel piano verticale α, che taglia il quadro lungo la verticale tα per la traccia Tᵣ della retta di base r.</text>
<text x="16" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Su tα lo spigolo superiore prolungato arriva all'altezza vera H: sul quadro le misure non si deformano.</text>
