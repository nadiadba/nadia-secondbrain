<text x="16" y="516" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Le facce lunghe del solido stanno su piani verticali (β davanti, γ dietro), come il piano secante α:</text>
<text x="16" y="536" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">α li taglia lungo le rette verticali r ed m, che bucano π₁ in T₁ᵣ e T₁ₘ, sulla traccia t₁α.</text>
<text x="16" y="556" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La sezione 1-2-3-4 (in rosso) è un rettangolo verticale; la parte sinistra (in grigio) si elimina.</text>
