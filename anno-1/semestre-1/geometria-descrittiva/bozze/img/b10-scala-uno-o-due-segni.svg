<text x="16" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">A sinistra la rampa è tagliata una volta: oltre il segno la scala sale sopra il piano di sezione</text>
<text x="16" y="307" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">e si tratteggia. A destra c'è una scala sopra e una sotto: i segni sono due, e i gradini che</text>
<text x="16" y="324" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">salgono dal piano inferiore, visti dall'alto, non si tratteggiano.</text>
