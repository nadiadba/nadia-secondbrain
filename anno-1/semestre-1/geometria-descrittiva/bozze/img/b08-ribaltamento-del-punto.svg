<text x="20" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. Per P₁ si traccia t₁γ perpendicolare a t₁α: γ è il piano proiettante in prima per P, ⊥ ad α.</text>
<text x="20" y="577" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. Ribaltamento laterale di γ: da P₁, perpendicolare a t₁γ, la quota di P (due lineette): P̄.</text>
<text x="20" y="594" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    HP̄ è la retta di massima pendenza m ribaltata, ed è il raggio di rotazione.</text>
<text x="20" y="611" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. Centro del compasso in H, raggio HP̄: l'arco porta P̄ su t₁γ. Lì c'è P*.</text>
