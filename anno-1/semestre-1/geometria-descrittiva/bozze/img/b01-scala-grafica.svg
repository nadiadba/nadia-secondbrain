<text x="50.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">1 m vero = 2 cm sul foglio</text>
<text x="16" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Lo schema non è in misura reale: conta il rapporto. In 1:50 tutto è il doppio che in 1:100.</text>
<text x="16" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La scala grafica resta giusta anche se il foglio viene ridotto o fotocopiato.</text>
