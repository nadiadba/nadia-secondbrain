<text x="16" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">lungo s: r e s sono perpendicolari a π₂ e lo bucano in un punto, r₂ e s₂, che stanno su t₂α.</text>
<text x="16" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">r taglia gli spigoli del fianco in 1 e 2, s quelli della faccia superiore in 3 e 4; la parte in grigio si elimina.</text>
