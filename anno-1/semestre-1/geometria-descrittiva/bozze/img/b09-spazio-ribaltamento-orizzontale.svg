<text x="20" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">L'asse è l'orizzontale o, alla quota di C: α si abbatte sul piano orizzontale (arancio) di quella quota.</text>
<text x="20" y="463" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">La quota di B (tratteggio nero) si misura da quel piano, non da π₁. Il piano è parallelo a π₁, quindi</text>
<text x="20" y="480" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">la prima proiezione di A*B*C* ha le stesse misure: per questo sul foglio la si disegna direttamente.</text>
