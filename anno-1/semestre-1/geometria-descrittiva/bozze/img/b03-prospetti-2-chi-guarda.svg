<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520"><rect width="100%" height="100%" fill="#fff"/><text x="12.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333" text-anchor="start" font-weight="bold">2. La pianta e le quattro persone che guardano i quattro lati</text><polygon points="245.0,225.0 340.0,225.0 340.0,185.0 515.0,185.0 515.0,335.0 245.0,335.0" fill="#e6e7ea" fill-opacity="1" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polygon points="405.0,335.0 435.0,335.0 435.0,331.0 405.0,331.0" fill="#fff" fill-opacity="1" stroke="#222" stroke-width="1" stroke-linejoin="round"/><text x="395.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333" text-anchor="middle">pianta</text><text x="292.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">rientranza</text><line x1="245.0" y1="225.0" x2="340.0" y2="225.0" stroke="#c0392b" stroke-width="5"/><line x1="340.0" y1="225.0" x2="340.0" y2="185.0" stroke="#c0392b" stroke-width="5"/><line x1="340.0" y1="185.0" x2="515.0" y2="185.0" stroke="#c0392b" stroke-width="5"/><line x1="245.0" y1="335.0" x2="515.0" y2="335.0" stroke="#2e7d32" stroke-width="5"/><line x1="245.0" y1="225.0" x2="245.0" y2="335.0" stroke="#2b5c9e" stroke-width="5"/><line x1="515.0" y1="185.0" x2="515.0" y2="335.0" stroke="#b7791f" stroke-width="5"/><circle cx="427" cy="90" r="8" fill="#c0392b"/><line x1="427.0" y1="102.0" x2="427.0" y2="132.0" stroke="#c0392b" stroke-width="2.5"/><line x1="421.0" y1="124.0" x2="427.0" y2="132.0" stroke="#c0392b" stroke-width="2.5"/><line x1="433.0" y1="124.0" x2="427.0" y2="132.0" stroke="#c0392b" stroke-width="2.5"/><text x="427.0" y="77.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">chi guarda il lato in alto</text><text x="427.0" y="61.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">(sta dall'altra parte del foglio)</text><circle cx="380" cy="430" r="8" fill="#2e7d32"/><line x1="380.0" y1="418.0" x2="380.0" y2="388.0" stroke="#2e7d32" stroke-width="2.5"/><line x1="386.0" y1="396.0" x2="380.0" y2="388.0" stroke="#2e7d32" stroke-width="2.5"/><line x1="374.0" y1="396.0" x2="380.0" y2="388.0" stroke="#2e7d32" stroke-width="2.5"/><text x="380.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle">chi guarda il lato in basso: tu</text><circle cx="150" cy="280" r="8" fill="#2b5c9e"/><line x1="162.0" y1="280.0" x2="192.0" y2="280.0" stroke="#2b5c9e" stroke-width="2.5"/><line x1="184.0" y1="286.0" x2="192.0" y2="280.0" stroke="#2b5c9e" stroke-width="2.5"/><line x1="184.0" y1="274.0" x2="192.0" y2="280.0" stroke="#2b5c9e" stroke-width="2.5"/><text x="150.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2b5c9e" text-anchor="middle">chi guarda il lato</text><text x="150.0" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2b5c9e" text-anchor="middle">a sinistra</text><circle cx="610" cy="260" r="8" fill="#b7791f"/><line x1="598.0" y1="260.0" x2="568.0" y2="260.0" stroke="#b7791f" stroke-width="2.5"/><line x1="576.0" y1="254.0" x2="568.0" y2="260.0" stroke="#b7791f" stroke-width="2.5"/><line x1="576.0" y1="266.0" x2="568.0" y2="260.0" stroke="#b7791f" stroke-width="2.5"/><text x="610.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle">chi guarda il lato</text><text x="610.0" y="311.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle">a destra</text><text x="380.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Ognuno sta fuori dall'edificio, davanti al suo lato, e guarda verso la pianta.</text></svg>