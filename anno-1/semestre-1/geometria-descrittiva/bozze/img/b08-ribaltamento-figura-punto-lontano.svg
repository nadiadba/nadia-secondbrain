<text x="20" y="555" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">1. B è il vertice più lontano da t₁α: lo si ribalta come il punto P (t₁γ, B̄ con la quota, raggio HB̄): B*.</text>
<text x="20" y="572" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">2. Affinità di asse t₁α: la retta B₁A₁ incontra l'asse in U; la retta UB* incontra in A* la</text>
<text x="20" y="589" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">    perpendicolare all'asse condotta da A₁. Allo stesso modo, con V, si trova C*.</text>
<text x="20" y="606" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">3. A*B*C* è la vera grandezza e forma del triangolo.</text>
