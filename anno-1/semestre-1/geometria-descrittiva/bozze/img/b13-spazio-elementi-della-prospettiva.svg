<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Nello spazio: gli elementi della prospettiva</text>
<g transform="translate(0,36)">
<polygon points="99.8,261.7 306.2,468.5 609.4,319.7 402.9,113.0" fill="#c9b98f" fill-opacity="0.18" stroke="#b5a77f" stroke-width="1"/>
<text x="511.2" y="319.7" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a7a4f">geometrale</text>
<polygon points="266.9,196.8 461.9,392.1 461.9,249.5 266.9,54.2" fill="#7fa6c9" fill-opacity="0.22" stroke="#5d88b0" stroke-width="1.2"/>
<text x="270.9" y="70.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f6b94">quadro</text>
<line x1="266.9" y1="196.8" x2="461.9" y2="392.1" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round"/>
<text x="467.9" y="402.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f1f1f">fondamentale</text>
<line x1="266.9" y1="136.2" x2="461.9" y2="331.5" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round"/>
<text x="200.9" y="140.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f1f1f">orizzonte</text>
<polygon points="111.3,212.6 306.2,407.9 461.9,331.5 266.9,136.2" fill="#d9a441" fill-opacity="0.08" stroke="#d9a441" stroke-width="1"/>
<text x="115.3" y="228.6" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b07d1e">piano d'orizzonte</text>
<line x1="190.7" y1="328.3" x2="190.7" y2="267.7" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="190.7" cy="267.7" r="2.8" fill="#1f1f1f"/>
<text x="172.7" y="261.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">O</text>
<text x="174.7" y="302.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a" font-style="italic">h</text>
<line x1="190.7" y1="267.7" x2="330.0" y2="199.4" stroke="#1f1f1f" stroke-width="1.2" stroke-dasharray="6,4" stroke-linecap="round"/>
<text x="256.4" y="225.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f1f1f" font-style="italic">d</text>
<circle cx="330.0" cy="199.4" r="2.8" fill="#1f1f1f"/>
<text x="334.0" y="191.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f1f1f" font-style="italic">O<tspan dy="4" font-size="70%">0</tspan><tspan dy="-4"></tspan></text>
<line x1="190.7" y1="267.7" x2="521.7" y2="268.6" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,3" stroke-linecap="round"/>
<circle cx="521.7" cy="268.6" r="2.8" fill="#c0392b"/>
<text x="527.7" y="272.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">P</text>
<circle cx="366.6" cy="268.2" r="2.8" fill="#c0392b"/>
<text x="372.6" y="262.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c0392b" font-style="italic">P′</text>
<text x="16" y="502" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">O guarda il quadro da distanza d, con l'occhio all'altezza h. O₀ è il piede della perpendicolare da O al quadro: sta sull'orizzonte.</text>
<text x="16" y="520" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il raggio da O al punto P del geometrale buca il quadro in P′: P′ è la prospettiva di P.</text>
</g>
</svg>
