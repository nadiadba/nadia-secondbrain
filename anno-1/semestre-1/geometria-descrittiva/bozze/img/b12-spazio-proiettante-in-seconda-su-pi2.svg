<text x="20" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">Il piano è perpendicolare a π₂: tutta la figura si proietta su t₂α. Ogni punto ruota su un arco</text>
<text x="20" y="469" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">che ha centro nella sua seconda proiezione e raggio uguale al suo aggetto. A e B hanno la stessa</text>
<text x="20" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444">seconda proiezione: dopo la rotazione A*B* è lungo come AB. La figura gira, non si restringe.</text>
