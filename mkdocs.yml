site_name: Second Brain — Architettura
site_description: Appunti universitari — Architettura, Università Roma Tre
site_author: Nadia

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: false

extra_javascript:
  - tema/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - tema/extra.css

nav:
  - Home: index.md
  - Storia dell'architettura:
    - storia-architettura/index.md
    - Appunti:
      - storia-architettura/appunti/ordini-architettonici.md
    - Lezioni:
      - storia-architettura/lezioni/01-tempio-e-ordini.md
  - Geometria descrittiva:
    - geometria-descrittiva/index.md
    - Sintesi:
      - geometria-descrittiva/sintesi/strumenti-e-disegno.md
  - Composizione architettonica:
    - composizione-architettonica/index.md
    - Sintesi:
      - composizione-architettonica/sintesi/introduzione-laboratorio.md
  - Matematica:
    - matematica/index.md
